# Atelier prototype manifest
#
# Per ADR-057 (Atelier ships /prototype as canonical harness chrome).
# Declares a project-mounted prototype that the substrate hosts at
# /prototype/<name>, wrapping the project's surfaces with harness chrome
# (reviewer drawer, strategy panel, traceability resolver, presence chip,
# annotation overlay).
#
# v1.x assumption: one project per Atelier instance. The harness reads
# THIS file and serves /prototype/<name> for the declared name only;
# requests to /prototype/<other> 404. Multi-project mounting is named
# as a re-evaluation trigger in ADR-057.
#
# Governance: changes to this file are PR-reviewed like any other config.
# No special approver required — the prototype is project-internal.

# Required: the project id. Becomes the URL segment under /prototype/.
# Must be URL-safe (lowercase, hyphens). Must match the dynamic-route
# segment value Next.js sees, otherwise the route 404s.
name: dashboard-northstar

# Required: the directory (relative to repo root) holding the project's
# content — pages, components, fixtures, lib, styles. Slice 1 ports the
# BB dashboard north-star surfaces here; substrate routes thinly re-export
# from this tree via prototype/src/app/prototype/[project]/<route>/page.tsx.
#
# Future: a built-artifact path (e.g., dist/) is the long-term mount
# target per ADR-057's "Atelier mounts the project's built content
# (static assets from the declared content_path)" clause. For v1.x in-
# repo projects, the source tree itself is the path.
content_path: prototypes/dashboard-northstar

# Traceability sources — where the harness resolver looks for design
# principles and research excerpts when slice 5 lands. Optional; missing
# files degrade gracefully. Paths are relative to repo root.
#
# The dashboard-northstar's BB-origin design-principles + research live
# in the atelier-dashboard-blueprint repo. v1.x slice-3 keeps these as
# placeholders; slice 5 either:
#   (a) copies the canonical docs into this repo alongside content_path
#   (b) configures the resolver to fetch from the BB repo URL
# That decision is named in ADR-057 re-evaluation triggers.
traceability_source:
  design_principles: prototypes/dashboard-northstar/docs/design-principles.md
  research_dir: prototypes/dashboard-northstar/docs/research

# Surfaces — one entry per route under the project mount. The harness
# uses these to (a) validate that strategy notes / traceability links are
# declared per-surface and (b) drive slice-4 strategy panel + slice-5
# traceability resolver. Slice 3 reads them but doesn't render surface-
# specific content yet (that's slice 4).
#
# Each entry:
#   route:           path under /prototype/<name>/ (leading slash required)
#   strategy_notes:  per-surface "why this exists, why this shape" prose
#                    (markdown allowed). Renders in the slice-4 strategy
#                    panel. Source of truth for design intent.
#   dps:             design-principle ids this surface enacts. Slice 5's
#                    traceability resolver renders excerpts via
#                    get_context(scope_files) keyed on these.
surfaces:
  - route: /
    strategy_notes: |
      Home is the brand surface + the cold-visitor on-ramp. The hero is a
      statement of substrate posture ("one canonical artifact"); the
      reviewer sidebar is the "show this to people" handle that supersedes
      `for-reviewers.md` as the primary share artifact.
    dps: [DP-2, DP-11]

  - route: /compose
    strategy_notes: |
      Compose is the wedge (DP-7). Action selector primitives:
      propose / claim / log_decision / checkpoint. Every authoring path
      lands here; no other surface authors. The territory selector is the
      only field that requires a deliberate choice — everything else
      defaults from context.
    dps: [DP-1, DP-3, DP-7, DP-13]

  - route: /inbox
    strategy_notes: |
      Action-shaped sections (DP-1) — section headers name what's being
      asked of you, not status. Each section is a server-side query in
      the eventual substrate (proposal.review_role x reaction_kind etc.);
      the prototype filters fixtures locally to demonstrate the IA.
    dps: [DP-1, DP-4, DP-6]

  - route: /activity
    strategy_notes: |
      Three loops, one timeline (ADR-055). Filter chips for loop +
      author kind sit above the fold (DP-8). Sort defaults to recency
      with trend-weighted as the opt-in (DP-4). Scale budget callout
      (DP-6): paginate at 50, virtualize at 500.
    dps: [DP-4, DP-6, DP-8, DP-9]

  - route: /atlas
    strategy_notes: |
      Historical projection across territories. Facets are explicit
      (proposal / synthesis / contribution / decision / lock) rather
      than auto-detected — the navigator stays declarative.
    dps: [DP-2, DP-8]

  - route: /connect
    strategy_notes: |
      Presence + integrations. The presence chip in the harness rail
      (slice 6) is the realtime view; /connect is the deliberate
      session-management surface (revoke / pause / lifecycle).
    dps: [DP-5]

  - route: /design-system
    strategy_notes: |
      Tokens, ramp tuples, components in isolation. Internal reference;
      not part of the canonical IA. Linked from the home reviewer
      sidebar for "what design system is this built with?" questions.
    dps: []
