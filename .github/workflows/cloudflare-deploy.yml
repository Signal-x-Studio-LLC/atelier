# Cloudflare deploy workflow for the Atelier prototype.
#
# Per ADR-052 (Cloudflare-primary infrastructure pivot, 2026-05-09).
# Migration tracked at BRD-OPEN-QUESTIONS §37.
#
# Activation gate: this workflow is gated behind the `vars.CF_DEPLOY_ENABLED`
# repository variable. Until an operator sets that to `true` (alongside the
# CLOUDFLARE_API_TOKEN + CLOUDFLARE_ACCOUNT_ID secrets), the workflow exits
# early on every trigger — preventing red CI on PRs that don't have the
# Cloudflare creds wired yet. Per the canonical-pattern-first discipline:
# the workflow shape lands in PR 1; the operator wiring lands at PR 4
# cutover; until then this is dormant scaffolding.

name: cloudflare-deploy

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'preview | production'
        required: true
        default: 'preview'
        type: choice
        options:
          - preview
          - production
  pull_request:
    branches: [main]
    paths:
      - 'prototype/**'
      - '.github/workflows/cloudflare-deploy.yml'

permissions:
  contents: read
  pull-requests: write

jobs:
  gate:
    name: Activation gate (CF_DEPLOY_ENABLED)
    runs-on: ubuntu-latest
    outputs:
      enabled: ${{ steps.check.outputs.enabled }}
    steps:
      - id: check
        run: |
          if [ "${{ vars.CF_DEPLOY_ENABLED }}" = "true" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
            echo "Cloudflare deploy gate OPEN — proceeding."
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::notice::CF_DEPLOY_ENABLED is not 'true' — workflow exits early."
            echo "::notice::Set vars.CF_DEPLOY_ENABLED=true in repo settings to activate (operator action; see docs/user/tutorials/cloudflare-bootstrap.md)."
          fi

  deploy:
    name: Build + deploy to Cloudflare Workers
    needs: gate
    if: needs.gate.outputs.enabled == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: prototype
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: prototype/package-lock.json

      - run: npm ci

      - name: Build via OpenNext Cloudflare adapter
        run: npm run cf:build
        env:
          NEXT_TELEMETRY_DISABLED: '1'

      - name: Deploy
        uses: cloudflare/wrangler-action@d4441f72b22ff2616b13a27a14a4434ddb70bee0 # v3.13.0
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: prototype
          # PR triggers do preview deploys; workflow_dispatch picks per input.
          command: >-
            ${{ (github.event_name == 'pull_request' || github.event.inputs.environment == 'preview')
                && 'deploy --env preview --name atelier-prototype-pr-${{ github.event.number || github.run_id }}'
                || 'deploy' }}

      - name: Comment preview URL on PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@60a0d83039c74a4aee543508d2ffcb1c3799cdea # v7.0.1
        with:
          script: |
            const prNumber = context.payload.number;
            const runId = context.runId;
            const url = `https://atelier-prototype-pr-${prNumber}.<your-cf-subdomain>.workers.dev`;
            github.rest.issues.createComment({
              issue_number: prNumber,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `Cloudflare preview deploy: ${url}\n\n_(Substitute \`<your-cf-subdomain>\` once operator wires the workers.dev subdomain — see docs/user/tutorials/cloudflare-bootstrap.md.)_`
            });
